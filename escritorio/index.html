<title>Escritório Be One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escritório 3D de dia (piso claro, divisórias cinza, cadeiras roxas), etiquetas pretas por área; fila de tarefas à direita; empilha no celular. Visual único, claro por escolha. */
:root {
  --page: #E9ECF2;
  --panel: #FFFFFF;
  --panel-2: #F4F6FA;
  --line: #D5DAE4;
  --ink: #161A26;
  --muted: #5E6779;
  --gold: #B8901C;
  --gold-btn: #E8C547;
  --tag: #14161C;
  --ok: #1E9E66;
  --doing: #2F7BD8;
  --wait: #D9822B;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 16px 32px; max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 6px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.01em; margin: 0; }
.brand h1 b { color: var(--gold); }
.brand .sub { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip strong { color: var(--ink); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.fila .dot { color: var(--wait); } .chip.fazendo .dot { color: var(--doing); } .chip.feito .dot { color: var(--ok); }
.chip.live .dot { color: var(--ok); box-shadow: 0 0 0 3px rgba(30,158,102,.18); }
.chip.off .dot { color: var(--muted); }

main.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 980px) { main.grid { grid-template-columns: minmax(0, 1fr); } }

.office { position: relative; min-width: 0; border-radius: 14px; overflow: hidden; background: linear-gradient(#DCE4F0, #EEF1F6); border: 1px solid var(--line); aspect-ratio: 16 / 10; max-width: 100%; }
@media (max-width: 640px) { .office { aspect-ratio: 4 / 5; } }
.office canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--tag); color: #fff; border-radius: 6px; font: 700 14px var(--f-body); white-space: nowrap; pointer-events: auto; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.tag .d { width: 11px; height: 11px; border-radius: 50%; }
.tag .n { font: 500 11px var(--f-mono); color: #B9BFCC; }
.tag .n:empty { display: none; }
.tag.sel { outline: 2px solid var(--gold-btn); outline-offset: 2px; }
.tag.brain { background: #2A2205; color: #F5E7B0; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: var(--ink); font: 600 12px var(--f-body); padding: 5px 10px; border-radius: 12px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 10px rgba(20,22,28,.18); border: 1px solid #E3E6EE; }
.hint { position: absolute; left: 12px; bottom: 10px; font: 400 11px var(--f-mono); color: #4A5263; background: rgba(255,255,255,.75); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

aside.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; }
.panel-h { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.panel-h h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-h h2 button { font: 500 12px var(--f-mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.team-card { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); }
.team-card p { margin: 0; }
.team-card .path { font-family: var(--f-mono); font-size: 11.5px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { font: 500 11.5px var(--f-mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }

form.add { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
form.add label { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input, select, textarea { font: 400 14px var(--f-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 58px; width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.row > select, .row > input { flex: 1 1 140px; }
.btn { font: 700 14px var(--f-body); color: #1A1606; background: var(--gold-btn); border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.btn:disabled { opacity: .55; cursor: progress; }
.form-msg { font-size: 12.5px; color: var(--muted); min-height: 1.2em; margin: 0; }

.filters { display: flex; gap: 6px; padding: 12px 16px 0; flex-wrap: wrap; }
.filters button { font: 500 12px var(--f-mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: #FBF3D6; }
ul.tasks { list-style: none; margin: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 620px; overflow-y: auto; }
li.task { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 10px 0; overflow: hidden; }
li.task .bar { border-radius: 0 3px 3px 0; }
li.task[data-s="fila"] .bar { background: var(--wait); }
li.task[data-s="fazendo"] .bar { background: var(--doing); }
li.task[data-s="feito"] .bar { background: var(--ok); }
li.task[data-s="feito"] .t-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.t-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.t-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.t-meta { font: 400 11.5px var(--f-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.t-meta .tm { font-weight: 500; }
.t-res { font-size: 12.5px; color: var(--ok); overflow-wrap: anywhere; }
.t-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.t-actions button { font: 500 11.5px var(--f-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.t-actions button:hover { border-color: var(--gold); }
.t-actions select.mv { font: 500 11px var(--f-mono); padding: 2px 4px; border-radius: 6px; max-width: 110px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px 4px; text-align: center; }
.empty strong { color: var(--ink); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Escritório <b>Be One</b></h1>
      <span class="sub">7 equipes · 1 cérebro · 97 notas</span>
    </div>
    <div class="stats" aria-live="polite">
      <span class="chip fila"><span class="dot"></span>Na fila <strong id="c-fila">0</strong></span>
      <span class="chip fazendo"><span class="dot"></span>Fazendo <strong id="c-fazendo">0</strong></span>
      <span class="chip feito"><span class="dot"></span>Feito <strong id="c-feito">0</strong></span>
      <span class="chip off" id="conn"><span class="dot"></span><span id="conn-t">Conectando…</span></span>
    </div>
  </header>

  <main class="grid">
    <section class="office" id="office" aria-label="Escritório em 3D">
      <div class="overlay" id="overlay"></div>
      <span class="hint">Arraste para girar · role para aproximar · clique num agente</span>
    </section>

    <aside class="panel">
      <div class="panel-h">
        <h2><span id="p-title">Todas as equipes</span><button type="button" id="p-clear" hidden>ver todas</button></h2>
        <div class="team-card" id="p-card"></div>
      </div>
      <form class="add" id="add">
        <label for="f-titulo">Nova tarefa</label>
        <textarea id="f-titulo" placeholder="Ex.: relatório de outubro da Sodiê Pinda" required></textarea>
        <div class="row">
          <select id="f-equipe" aria-label="Equipe"><option value="auto">Claude escolhe a equipe</option></select>
          <input id="f-cliente" placeholder="Cliente (opcional)" aria-label="Cliente">
        </div>
        <button class="btn" id="f-btn" type="submit">Pôr na fila</button>
        <p class="form-msg" id="f-msg"></p>
      </form>
      <div class="filters" role="group" aria-label="Filtrar por estado">
        <button type="button" data-f="ativas" aria-pressed="true">Ativas</button>
        <button type="button" data-f="fila" aria-pressed="false">Fila</button>
        <button type="button" data-f="fazendo" aria-pressed="false">Fazendo</button>
        <button type="button" data-f="feito" aria-pressed="false">Feito</button>
      </div>
      <ul class="tasks" id="tasks">
        <li class="empty" id="empty">A fila aparece aqui. Escreva a <strong>primeira tarefa</strong> acima.</li>
      </ul>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const TEAMS = [
  { id: "diretoria",   nome: "Diretoria",   cor: "#E8C547", gx: 0, gy: 0, agentes: 1, desc: "Prioriza, cobra pendências e distribui o trabalho.", tools: ["gerente-lucas", "Notion"] },
  { id: "atendimento", nome: "Atendimento", cor: "#E9699A", gx: 1, gy: 0, agentes: 2, desc: "Onboarding, perfil, histórico e felicidade dos clientes.", tools: ["client-profile", "Notion", "Google Calendar"] },
  { id: "conteudo",    nome: "Conteúdo",    cor: "#9A6BF0", gx: 2, gy: 0, agentes: 3, desc: "Lotes do mês, pautas, roteiros e peças.", tools: ["content-planning", "client-profile", "Canva"] },
  { id: "trafego",     nome: "Tráfego",     cor: "#3D8EF0", gx: 2, gy: 1, agentes: 3, desc: "Meta Ads: relatórios, otimização, públicos. Usa o Jev para triagem.", tools: ["relatorio-meta-ads", "Meta Ads", "TypeSafe Jev"] },
  { id: "comercial",   nome: "Comercial",   cor: "#EE8B35", gx: 2, gy: 2, agentes: 1, desc: "Propostas e orçamentos de LP e site.", tools: ["proposta-landing-page"] },
  { id: "sites",       nome: "Sites",       cor: "#2FB57A", gx: 1, gy: 2, agentes: 2, desc: "Landing pages e sites depois da proposta aprovada.", tools: ["landing-page-build", "Canva"] },
  { id: "expansao",    nome: "Expansão",    cor: "#22A9BD", gx: 0, gy: 2, agentes: 1, desc: "Inventário de lojas e investimento de franquia.", tools: ["inventario-loja-investimento", "Google Drive"] },
];
const byId = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const NEXT = { fila: "fazendo", fazendo: "feito", feito: "fila" };
const NEXT_LBL = { fila: "começar", fazendo: "concluir", feito: "reabrir" };
const GREET = ["oi!", "e aí?", "bom dia!", "👋"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- Estado da fila ---------- */
let tasks = [], selTeam = null, filter = "ativas", db = null, sample = null;
const currentTask = id => tasks.find(t => t.equipe === id && t.status === "fazendo");
const queuedTask = id => tasks.find(t => t.equipe === id && t.status === "fila");
function counts(team) { const r = { fila: 0, fazendo: 0, feito: 0 }; tasks.forEach(t => { if ((!team || t.equipe === team) && r[t.status] !== undefined) r[t.status]++; }); return r; }

/* ---------- Cena 3D ---------- */
const office = document.getElementById("office"), overlay = document.getElementById("overlay");
const CELL = 10, STEP = 12.4;
const cellPos = (gx, gy) => ({ x: (gx - 1) * STEP, z: (gy - 1) * STEP });
const LOUNGE = { gx: 0, gy: 1 }, BRAIN = { gx: 1, gy: 1 };
let scene, camera, renderer, controls, raycaster, pointer, loungePos, brainCore;
const agents = [], tags = {}, clickables = [], seats = {}, mats = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .82, metalness: 0 }, o))); };
function B(w, h, d, color, x, y, z, parent, o) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, o)); m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m; }
function Cyl(rt, rb, h, color, x, y, z, parent, seg = 16) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(color)); m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m; }
const mix = (a, b, t) => "#" + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString();

function chair(x, z, rot, g) {
  const c = new THREE.Group(); c.position.set(x, 0, z); c.rotation.y = rot; g.add(c);
  Cyl(.04, .04, .32, "#3A3A44", 0, .05, 0, c, 8);
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; const leg = B(.34, .04, .06, "#3A3A44", Math.cos(a) * .16, .03, -Math.sin(a) * .16, c); leg.rotation.y = a; }
  B(.56, .1, .52, "#8A6FB8", 0, .37, 0, c);
  B(.56, .5, .1, "#7C62A8", 0, .47, .26, c);
}
function desk(x, z, team, g) {
  B(1.7, .07, .85, "#C99B62", x, .72, z, g);
  B(1.62, .5, .05, "#A97E4C", x, .22, z - .38, g);
  [[-.78, -.36], [.78, -.36], [-.78, .36], [.78, .36]].forEach(([a, b]) => B(.07, .72, .07, "#2C2C34", x + a, 0, z + b, g));
  B(.1, .22, .08, "#2B2F3A", x, .79, z - .2, g);
  B(.74, .44, .05, "#2B2F3A", x, 1.0, z - .22, g);
  const scr = B(.66, .36, .01, team.cor, x, 1.04, z - .193, g, { emissive: team.cor, emissiveIntensity: .55 }); scr.castShadow = false;
  B(.5, .02, .16, "#E6E2D6", x - .05, .79, z + .08, g);
  Cyl(.05, .05, .1, "#F5F0E1", x + .55, .79, z + .05, g, 10);
  chair(x, z + .78, 0, g);
}
function plant(x, z, g, big) {
  Cyl(.22, .17, .4, "#E9E4DA", x, 0, z, g, 14);
  const n = big ? 7 : 5;
  for (let i = 0; i < n; i++) { const a = i / n * 6.28; const l = B(.08, big ? 1.2 : .8, .04, i % 2 ? "#3FA796" : "#56C2AE", x + Math.cos(a) * .08, .35, z + Math.sin(a) * .08, g); l.rotation.z = Math.cos(a) * .35; l.rotation.x = Math.sin(a) * .35; }
}
function sofa(x, z, rot, color, g) {
  const s = new THREE.Group(); s.position.set(x, 0, z); s.rotation.y = rot; g.add(s);
  B(2, .42, .9, color, 0, .08, 0, s); B(2, .5, .25, color, 0, .5, -.33, s); B(.25, .35, .9, color, -.88, .5, 0, s); B(.25, .35, .9, color, .88, .5, 0, s);
  [[-.9, -.38], [.9, -.38], [-.9, .38], [.9, .38]].forEach(([a, b]) => B(.08, .08, .08, "#2C2C34", a, 0, b, s));
}
function bookshelf(x, z, g) {
  const s = new THREE.Group(); s.position.set(x, 0, z); g.add(s);
  B(1.6, 1.8, .4, "#8A6440", 0, 0, 0, s);
  const cols = ["#C65B4E", "#E8C547", "#5B8DD6", "#2FB57A", "#9A6BF0", "#EE8B35", "#F2EEE3"];
  for (let r = 0; r < 3; r++) { B(1.5, .04, .36, "#6E4F31", 0, .25 + r * .55, .03, s); let bx = -.68; while (bx < .62) { const w = rnd(.06, .12); B(w, rnd(.28, .42), .28, pick(cols), bx + w / 2, .29 + r * .55, .05, s); bx += w + .02; } }
}
function roundTable(x, z, g) { Cyl(.6, .6, .06, "#C99B62", x, .7, z, g, 24); Cyl(.06, .06, .7, "#2C2C34", x, 0, z, g, 8); Cyl(.3, .3, .03, "#2C2C34", x, 0, z, g, 16); }

function wall(x, z, len, alongX, g, doorAt = .5) {
  const H = 2.3, T = .22, door = 1.7;
  const a = len * doorAt - door / 2, b = len * doorAt + door / 2;
  const seg = (s0, s1) => { const L = s1 - s0, c = s0 + L / 2 - len / 2; if (alongX) { B(L, H, T, "#7D808B", x + c, 0, z, g); B(L, .05, T + .02, "#55575F", x + c, H, z, g); } else { B(T, H, L, "#7D808B", x, 0, z + c, g); B(T + .02, .05, L, "#55575F", x, H, z + c, g); } };
  seg(0, a); seg(b, len);
  const mid = a + door / 2 - len / 2;
  if (alongX) B(door, .25, T, "#8E9099", x + mid, H - .25, z, g); else B(T, .25, door, "#8E9099", x, H - .25, z + mid, g);
}

function zone(t) {
  const p = cellPos(t.gx, t.gy), g = new THREE.Group(); g.position.set(p.x, 0, p.z); scene.add(g);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(CELL, .06, CELL), M(mix("#E3D8C6", t.cor, .2)));
  floor.position.y = .03; floor.receiveShadow = true; floor.userData.team = t.id; g.add(floor); clickables.push(floor);
  const rug = new THREE.Mesh(new THREE.BoxGeometry(6.2, .02, 5.4), M(mix("#F4EEE4", t.cor, .45)));
  rug.position.set(.6, .07, .8); rug.receiveShadow = true; rug.userData.team = t.id; g.add(rug); clickables.push(rug);
  wall(0, -CELL / 2, CELL, true, g);
  wall(-CELL / 2, 0, CELL, false, g);
  B(CELL, .12, .24, t.cor, 0, 2.35, -CELL / 2, g); B(.24, .12, CELL, t.cor, -CELL / 2, 2.35, 0, g);
  if (t.id === "diretoria") { sofa(-2.6, -4.1, 0, "#7C62A8", g); roundTable(2.8, -2.8, g); chair(2.8, -2, 0, g); chair(2, -2.8, -Math.PI / 2, g); }
  else bookshelf(-3.2, -4.6, g);
  plant(4.2, -4.2, g, true); plant(-4.3, 4.2, g, false);
  const spots = { 1: [[.6, .6]], 2: [[-1.4, -.6], [2.2, 1.8]], 3: [[-1.5, -1.2], [2.2, -1.2], [.4, 2.1]] }[t.agentes];
  seats[t.id] = spots.map(([x, z]) => { desk(x, z, t, g); return { x: p.x + x, z: p.z + z + .78 }; });
}

function lounge() {
  const p = cellPos(LOUNGE.gx, LOUNGE.gy), g = new THREE.Group(); g.position.set(p.x, 0, p.z); scene.add(g);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(CELL, .06, CELL), M("#E2D7C6")); floor.position.y = .03; floor.receiveShadow = true; g.add(floor);
  for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) if ((i + j) % 2) { const tl = new THREE.Mesh(new THREE.BoxGeometry(2, .01, 2), M("#D6C9B4")); tl.position.set(-4 + i * 2, .065, -4 + j * 2); tl.receiveShadow = true; g.add(tl); }
  B(.8, 1, 3, "#8A6440", -4.2, 0, -2, g); B(.86, .06, 3.06, "#EDE7DC", -4.2, 1, -2, g);
  B(.5, .6, .45, "#2B2F3A", -4.2, 1.06, -2.8, g); B(.12, .12, .02, "#FF6B5A", -4.0, 1.4, -2.57, g, { emissive: "#FF6B5A", emissiveIntensity: .8 });

  ["atendimento", /(cliente|reuni[aã]o|onboarding|perfil|cobran|briefing|feedback)/i],
];
function guessTeam(text) { for (const [id, re] of KEYWORDS) if (re.test(text)) return { equipe: id, motivo: "por palavra-chave" }; return { equipe: "diretoria", motivo: "triagem da Diretoria" }; }
async function routeTeam(text, cliente) {
  if (sample) {
    try {
      const r = await sample.json(`Você é a Diretoria da agência Be One Marketing Digital. Escolha UMA equipe para executar a tarefa.\nEquipes:\n${TEAMS.map(t => `- ${t.id}: ${t.desc}`).join("\n")}\n\nTarefa: ${text}\nCliente: ${cliente || "não informado"}\n\nResponda só JSON: {"equipe": "<id>", "motivo": "<até 6 palavras>"}`, { modelTier: "quick" });
      if (r && byId[r.equipe]) return { equipe: r.equipe, motivo: String(r.motivo || "escolhida pelo Claude").slice(0, 60) };
    } catch (e) { if (e?.code === "not_granted") sample = null; }
  }
  return guessTeam(text);
}
document.getElementById("add").addEventListener("submit", async ev => {
  ev.preventDefault();
  const tEl = document.getElementById("f-titulo"), eq = document.getElementById("f-equipe"), cl = document.getElementById("f-cliente"), btn = document.getElementById("f-btn");
  const titulo = tEl.value.trim(); if (!titulo) return;
  btn.disabled = true; msg(eq.value === "auto" ? "Escolhendo a equipe…" : "Salvando…");
  const cliente = cl.value.trim();
  const r = eq.value === "auto" ? await routeTeam(titulo, cliente) : { equipe: eq.value, motivo: "escolhida à mão" };
  const doc = { titulo, cliente, equipe: r.equipe, motivo: r.motivo, status: "fila", criado: Date.now() };
  try {
    if (db) await db.collection("tarefas").add(doc);
    else { const t = { id: "local-" + Date.now(), ...doc }; tasks.push(t); onTaskEvent("nova", t); renderPanel(); }
    tEl.value = ""; cl.value = "";
    msg(`Na fila da equipe ${byId[r.equipe].nome}${db ? "" : " (só nesta tela: sem conexão com a fila compartilhada)"}.`);
  } catch (e) { msg("Não deu para salvar: " + (e?.message || e?.code || "erro")); }
  btn.disabled = false;
});
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderTasks(); }));
document.getElementById("p-clear").addEventListener("click", () => { selTeam = null; renderPanel(); });
const selEq = document.getElementById("f-equipe");
TEAMS.forEach(t => { const o = document.createElement("option"); o.value = t.id; o.textContent = t.nome; selEq.appendChild(o); });

const ok3d = initScene();
renderPanel();
if (ok3d) requestAnimationFrame(loop);

(async () => {
  const conn = document.getElementById("conn"), ct = document.getElementById("conn-t");
  const use = window.claude?.use;
  if (!use) { ct.textContent = "Fila local"; return; }
  use("sample").then(s => { if (s) sample = s; }).catch(() => {});
  try { db = await use("db"); } catch { db = null; }
  if (!db) { ct.textContent = "Fila local"; renderTasks(); return; }
  conn.classList.replace("off", "live"); ct.textContent = "Fila compartilhada";
  let first = true;
  db.collection("tarefas").onSnapshot(snap => {
    const prev = Object.fromEntries(tasks.map(t => [t.id, t]));
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!first) snap.docChanges().forEach(ch => {
      const t = { id: ch.doc.id, ...ch.doc.data() }, old = prev[t.id];
      if (ch.type === "added") onTaskEvent("nova", t);
      else if (ch.type === "modified" && old) { if (old.equipe !== t.equipe) onTaskEvent("nova", t); else if (old.status !== t.status) onTaskEvent(t.status, t); }
    });
    first = false; renderPanel();
  }, e => { conn.classList.replace("live", "off"); ct.textContent = "Fila offline"; msg("A fila compartilhada caiu: " + (e?.message || e?.code)); });
})();
</script>
